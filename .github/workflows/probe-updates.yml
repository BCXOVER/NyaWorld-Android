name: Probe NyaWorld PC updates

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_manifest.py'
      - '.github/workflows/probe-updates.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read public PC manifest metadata
        run: python3 scripts/probe_manifest.py
