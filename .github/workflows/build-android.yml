name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/brand_test.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout XDAetherium engine
        run: git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/Promastergame/XDAetherium.git engine
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-24.04 GitHub-hosted runners already provide Android command-line tools.
          # Avoid android-actions/setup-android@v3: it attempts to install the
          # deprecated "tools" package, failing with "Failed to find package 'tools'".
          : "${ANDROID_HOME:?GitHub runner has no ANDROID_HOME}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager is not present on runner"
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses >/dev/null 2>&1) || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"
      - name: Apply NyaWorld test branding
        run: python3 scripts/brand_test.py engine
      - name: Build test APK
        run: |
          cd engine
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nyaworld-engine-test-apk
          path: engine/app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
